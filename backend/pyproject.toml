[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12.8"
dependencies = [
    "arq>=0.27.0",
    "django-bolt>=0.6.5",
    "django-cors-headers>=4.9.0",
    "fastexcel>=0.19.0",
    "gliclass>=0.1.16",
    "gliner>=0.2.25",
    "onnxruntime>=1.24.3",
    "polars>=1.38.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "xlsxwriter>=3.2.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "finnlens.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
