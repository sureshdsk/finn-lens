# Default email sender rules for classifying financial emails.
#
# Each rule maps a sender pattern (fnmatch syntax) to a source type.
# More specific patterns (fewer wildcards) are matched first automatically.
#
# Source types: bank, credit_card, investment, subscription, ecommerce, bill
#
# To add a new rule: append to the appropriate section and run:
#   uv run python manage.py bootstrap_sender_rules

# ── Bank account e-statements ────────────────────────────────────────────
# Exact sender addresses for bank account statement emails.
# These carry PDF attachments with monthly transaction data.

- pattern: "estatement@icicibank.com"
  source_type: bank

# ── Credit cards ─────────────────────────────────────────────────────────
# Wildcard domain rules for credit card transaction alerts and statements.

- pattern: "*@hdfcbank.net"
  source_type: credit_card

- pattern: "*@icicibank.com"
  source_type: credit_card

- pattern: "*@axisbank.com"
