services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finnlens}
    restart: unless-stopped

  redis:
    restart: unless-stopped
    ports: []

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://finnlens:${POSTGRES_PASSWORD:-finnlens}@postgres:5432/finnlens
      REDIS_URL: redis://redis:6379
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes: []
    ports: []

  worker:
    build:
      context: ./backend
      target: prod
    environment:
      DATABASE_URL: postgresql://finnlens:${POSTGRES_PASSWORD:-finnlens}@postgres:5432/finnlens
      REDIS_URL: redis://redis:6379
      DEBUG: "False"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes: []
    command: ["uv", "run", "arq", "worker.WorkerSettings"]

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    volumes: []
    environment: {}
