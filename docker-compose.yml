services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finnlens
      POSTGRES_USER: finnlens
      POSTGRES_PASSWORD: finnlens
    ports:
      - "5432:5432"
    volumes:
      - finnlens_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finnlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - classifier_cache:/root/.cache/finnlens
    environment:
      DATABASE_URL: postgresql://finnlens:finnlens@postgres:5432/finnlens
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:5174
      DEBUG: "True"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
      - classifier_cache:/root/.cache/finnlens
    environment:
      DATABASE_URL: postgresql://finnlens:finnlens@postgres:5432/finnlens
      REDIS_URL: redis://redis:6379
      DEBUG: "True"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["uv", "run", "watchfiles", "--filter", "python", "arq worker.WorkerSettings", "."]

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  finnlens_pg_data:
  classifier_cache:
